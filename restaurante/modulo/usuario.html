<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>USUARIO</title>
</head>
<body>

  <script src="../js/usuario.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>

<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-seven-desktop is-full-mobile">
        
        <div class="box">
          <div class="has-text-centered mb-5">
            <span class="icon is-large has-text-success">
              <i class="fas fa-user-circle fa-3x"></i>
            </span>
            <h1 class="title mt-3">Registro de Usuario</h1>
          </div>

          <div class="columns">
            <div class="column">
              <div class="field">
                <label class="label">Nombre</label>
                <div class="control">
                  <input id="nombre" class="input" type="text" placeholder="Ej: Juan">
                </div>
              </div>
            </div>
            <div class="column">
              <div class="field">
                <label class="label">Apellidos</label>
                <div class="control">
                  <input id="apellidos" class="input" type="text" placeholder="Ej: Pérez">
                </div>
              </div>
            </div>
          </div>

          <div class="columns">
            <div class="column is-4">
              <div class="field">
                <label class="label">País</label>
                <div class="control has-icons-left">
                  <div class="select is-fullwidth">
                    <select id="pais">
                      <option disabled selected>Selecciona</option>
                      <option>COL (+57)</option>
                      <option>USA (+1)</option>
                    </select>
                  </div>
                  <span class="icon is-small is-left">
                    <i class="fas fa-globe"></i>
                  </span>
                </div>
              </div>
            </div>
            <div class="column">
              <div class="field">
                <label class="label">Teléfono</label>
                <div class="control">
                  <input id="telefono" class="input" type="number" placeholder="300 000 0000">
                </div>
              </div>
            </div>
          </div>

          <div class="columns">
            <div class="column is-4">
              <div class="field">
                <label class="label">Tipo ID</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select id="documeto">
                      <option>C.C</option>
                      <option>T.I</option>
                      <option>VISA</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            <div class="column">
              <div class="field">
                <label class="label">Número de Documento</label>
                <div class="control">
                  <input id="numero_documento" class="input" type="number" placeholder="123456789">
                </div>
              </div>
            </div>
          </div>

          <div class="columns">
            <div class="column">
              <div class="field">
                <label class="label">Fecha Nacimiento</label>
                <input id="nacimiento" class="input" type="date">

</body>
</html>
