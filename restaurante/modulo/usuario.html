<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USUARIO</title>
</head>
<body>

<center>

    <div class="field">
  <label class="label">NOMBRE</label>
  <div class="control">
    <input class="input" type="text" placeholder="nombre completo">
  </div>
</div>

<h1></h1>

<div class="field">
  <label class="label">APELLIDOS</label>
  <div class="control">
    <input class="input" type="text" placeholder="apellidos completos">
  </div>
</div>

<div class="field">
  <p class="control has-icons-left">
    <span class="select">
      <select>
        <option selected>pais</option>
        <option>COLOMBIA (+57)</option>
        <option>USA (+1)</option>
      </select>
    </span>
    <span class="icon is-small is-left">
      <i class="fas fa-globe"></i>
    </span>
  </p>
</div>

<div class="field">
  <label class="label">TELEFONO</label>
  <div class="control">
    <input class="input" type="int" placeholder="teleono">
  </div>
</div>

<h1></h1>

<div class="field">
  <label class="label">FECHA DE NACIMIENTO</label>
  <div class="control">
    <input class="input" type="DATE" placeholder="nacimiento">
  </div>
</div>

<h1></h1>

<div class="field">
  <p class="control has-icons-left">
    <span class="select">
      <select>
        <option selected>TIPO DE DOCUMENTO</option>
        <option>C.C</option>
        <option>T.I</option>
        <option>VISA</option>
      </select>
    </span>
    <span class="icon is-small is-left">
      <i class="fas fa-globe"></i>
    </span>
  </p>
</div>

<div class="field">
  <label class="label">NUMERO DE DOCUMENTO</label>
  <div class="control">
    <input class="input" type="int" placeholder="identificacion">
  </div>
</div>

<h1></h1>

<div class="field">
  <p class="control has-icons-left">
    <span class="select">
      <select>
        <option selected>GENERO</option>
        <option>Hombre</option>
        <option>Mujer</option>
        <option>otro</option>
      </select>
    </span>
    <span class="icon is-small is-left">
      <i class="fas fa-globe"></i>
    </span>
  </p>
</div>

<h1></h1>

<div class="field">
  <p class="control has-icons-left">
    <span class="select">
      <select>
        <option selected>CARGO</option>
        <option>Trabajador</option>
        <option>Cliente</option>
        <option>Administrador</option>
      </select>
    </span>
    <span class="icon is-small is-left">
      <i class="fas fa-globe"></i>
    </span>
  </p>
</div>

<div class="field">
  <p class="control has-icons-left has-icons-right">
    <input class="input" type="email" placeholder="Email">
    <span class="icon is-small is-left">
      <i class="fas fa-envelope"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </p>
</div>
<div class="field">
  <p class="control has-icons-left">
    <input class="input" type="password" placeholder="Password">
    <span class="icon is-small is-left">
      <i class="fas fa-lock"></i>
    </span>
  </p>
</div>
<div class="field">
  <p class="control">
    <button class="button is-success">
      Login
    </button>
  </p>
</div>

</center>

</body>
</html>
