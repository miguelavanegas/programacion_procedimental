<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>contabilidad</title>
  </head>
  <body>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <script
      defer
      src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"
    ></script>

    <section class="section">
      <div class="container">
        <div class="columns">
          <div class="column is-one-quarter">
            <div class="box has-text-centered">
              <figure class="image is-128x128 is-inline-block">
                <img
                  class="is-rounded"
                  src="https://cdn-icons-png.flaticon.com/128/6676/6676016.png"
                  alt="User Avatar"
                />
              </figure>
              <div class="mt-4">
                <p class="title is-5">Admin Contable</p>
                <p class="subtitle is-6">@usuario_finanzas</p>
              </div>
              <hr />
              <a href="/restaurante/index.html" class="button is-info">
        Ir al inicio
      </a>
            </div>
          </div>

          <div class="column">
            <div class="box">
              <h1 class="title has-text-centered has-text-info">
                CONTABILIDAD
              </h1>
              <hr />

              <div class="field">
                <label class="label">Ventas</label>
                <div class="control has-icons-left">
                  <input
                    id="Ventas"
                    class="input is-info"
                    type="number"
                    placeholder="Ej: 20"
                  />
                  <span class="icon is-small is-left">
                    <i class="fas fa-search-dollar"></i>
                  </span>
                </div>
              </div>

              <div class="field">
                <label class="label">Fecha</label>
                <div class="control has-icons-left">
                  <input id="fecha" class="input is-info" type="date" />
                  <span class="icon is-small is-left">
                    <i class="fas fa-calendar-alt"></i>
                  </span>
                </div>
              </div>

              <div class="columns">
                <div class="column">
                  <div class="field">
                    <label class="label">Ingresos</label>
                    <div class="control">
                      <input
                        id="ingresos"
                        class="input is-info"
                        type="number"
                        placeholder="$"
                      />
                    </div>
                  </div>
                </div>
                <div class="column">
                  <div class="field">
                    <label class="label">Egresos</label>
                    <div class="control">
                      <input
                        id="egresos"
                        class="input is-info"
                        type="number"
                        placeholder="$"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="columns">
                <div class="column is-two-thirds">
                  <div class="field">
                    <label class="label">Concepto</label>
                    <div class="control">
                      <input
                        id="concepto"
                        class="input is-info"
                        type="text"
                        placeholder="¿Por qué salió el dinero?"
                      />
                    </div>
                  </div>
                </div>
                <div class="column">
                  <div class="field">
                    <label class="label">Valor</label>
                    <div class="control">
                      <input
                        id="valor"
                        class="input is-info"
                        type="number"
                        placeholder="$"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="field mt-5">
                <div class="control">
                  <button
                    id="btnGuardar"
                    type="button"
                    class="button is-info is-fullwidth is-rounded"
                  >
                    <span class="icon"><i class="fas fa-save"></i></span>
                    <span>GuardarRegistro</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/contabilidad.js"></script>
  </body>
</html>
