<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link

    <title>contabilidad</title>

<body>
  <div style="position: absolute; top: 20px; z-idex: 999;">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>

<section class="section">
    <div class="colum is-one-quarter">
        <anside class="menu">
            <img src="https://cdn-icons-png.flaticon.com/128/6676/6676016.png" alt="">
        </anside>
    </div>

  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">
        
        <div class="box">
          <h1 class="title has-text-centered has-text-info">CONTABILIDAD</h1>
          <hr>

          <div class="field">
            <label class="label">Ventas</label>
            <div class="control has-icons-left">
              <input class="input is-info" type="number" placeholder="Ej: 20">
              <span class="icon is-small is-left">
                <i class="fas fa-search-dollar"></i>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="label">fecha</label>
            <div class="control has-icons-left">
              <input class="input is-info" type="date" placeholder="Nombre del artículo">
              <span class="icon is-small is-left">
                <i class="fas fa-calendar-alt"></i>
              </span>
            </div>
          </div>

          <div class="columns">
            <div class="column">
              <div class="field">
                <label class="label">Ingresos</label>
                <div class="control">
                  <input class="input is-info" type="number" placeholder="$">
                </div>
              </div>
            </div>
            <div class="column">
              <div class="field">
                <label class="label">Egresos</label>
                <div class="control">
                  <input class="input is-info" type="number" placeholder="$">
                </div>
              </div>
            </div>
          </div>

                    <div class="columns">
            <div class="column">
              <div class="field">
                <label class="label">Concepto</label>
                <div class="control">
                  <input class="input is-info" type="text" placeholder="porque salio">
                </div>
              </div>
            </div>
            <div class="column">
              <div class="field">
                <label class="label">Valor</label>
                <div class="control">
                  <input class="input is-info" type="number" placeholder="$">
                </div>
              </div>
            </div>
          </div>

          <div class="field mt-5">
            <div class="control">
              <button class="button is-info is-fullwidth is-rounded">
                <span class="icon"><i class="fas fa-save"></i></span>
                <span>Guardar Producto</span>
              </button>
            </div>
          </div>

        </div> </div>
    </div>
  </div>
